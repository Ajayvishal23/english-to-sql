name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The test suite uses a fake LLM, so the heavy model stack
      # (torch/transformers) is not needed here.
      - name: Install test dependencies
        run: pip install "streamlit>=1.36" "SQLAlchemy>=2.0" "pandas>=2.2" "langchain-core>=0.3" "pytest>=8.0"
      - name: Run tests
        run: python -m pytest -q
